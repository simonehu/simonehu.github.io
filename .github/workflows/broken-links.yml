name: Check for broken links

on:
  push:
    branches:
      - hyde
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/prettier.yml"
#  pull_request:
#    branches:
#      - hyde
#    paths:
#      - "assets/**"
#      - "**.html"
#      - "**.js"
#      - "**.liquid"
#      - "**/*.md"
#      - "**.yml"
#      - "!.github/workflows/axe.yml"
#      - "!.github/workflows/prettier.yml"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    # only run on the main repo
    if: github.repository == 'simonehu/simonehu.github.io'
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # removed md files that include liquid tags
          args: --user-agent 'curl/7.54' --exclude-path README.md --exclude-path _pages/404.md --exclude-path _pages/blog.md --verbose --no-progress './**/*.md' './**/*.html'
